name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # ── Ubuntu (native runner) ──────────────────────────────────────────────────
  ubuntu:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace
      - name: Hybrid smoke (integration gate)
        run: cargo test -p pyred --test hybrid_smoke -- --nocapture

  # ── Fedora (container) ─────────────────────────────────────────────────────
  fedora:
    name: fedora-latest
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install deps
        run: dnf install -y git rust cargo rustfmt clippy
      - uses: actions/checkout@v4
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace

  # ── Arch Linux (container) ─────────────────────────────────────────────────
  archlinux:
    name: archlinux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install deps
        run: pacman -Sy --noconfirm git rust
      - uses: actions/checkout@v4
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace
