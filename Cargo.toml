[workspace]
resolver = "2"
members = [
    "crates/pyre-proto",
    "crates/pyred",
    "crates/pyrec",
    "crates/pyre-tui",
    "crates/pyre-gpu",
    "crates/pyre-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["pyre contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tarpc = { version = "0.34", features = ["serde-transport", "serde-transport-bincode", "tokio1", "unix"] }
portable-pty = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
bytes = "1"
tokio-util = { version = "0.7", features = ["codec"] }
tokio-serde = { version = "0.9", features = ["bincode"] }
bincode = "1"
serde_bytes = "0.11"
nix = { version = "0.29", features = ["term", "signal"] }
libc = "0.2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "uuid"] }
zstd = "0.13"
alacritty_terminal = "0.26"
dirs = "5"
regex = "1"
async-trait = "0.1"
ratatui = "0.30"
crossterm = "0.29"
tantivy = "0.26"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release-prod]
inherits = "release"
strip = true
lto = "fat"
opt-level = 3
codegen-units = 1
