[workspace]
resolver = "2"
members = [
    "crates/pyre-proto",
    "crates/pyred",
    "crates/pyrec",
    "crates/pyre-tui",
    "crates/pyre-gpu",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["pyre contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
