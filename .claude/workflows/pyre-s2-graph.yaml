id: pyre-s2
name: Pyre S2 Blocks + Persistence
version: 1.0.0
description: |
  Sprint 2. Eight phases. Goal per ROADMAP S2: integrate alacritty_terminal,
  detect OSC 133, materialise Block records, persist to SQLite + zstd blobs,
  expose `pyrec list` and `pyrec search` (linear scan).

    1. deps-s2       — add sqlx, zstd, alacritty_terminal, dirs, regex
    2. block-proto   — pyre-proto: Block, BlockEvent, list/search RPC types
    3. parser        — pyred: tap PTY output, feed alacritty parser, emit OSC 133 events
    4. store         — pyred: sqlite (WAL) at $XDG_DATA_HOME/pyre/state.db + zstd stdout blobs
    5. wire-blocks   — parser events -> store writes; one blob per block
    6. rpc-list      — extend PyreDaemon with list_blocks + search_blocks (linear)
    7. pyrec-cli     — `pyrec list` and `pyrec search <query>` subcommands
    8. smoke-blocks  — integration: inject OSC 133 via PTY, assert row + blob + list/search
    9. commit-s2     — `feat: s2 blocks + sqlite + zstd + linear search`

  Hard constraints (CLAUDE.md + ROADMAP):
    - NO MCP / AI module (still blocked until S5).
    - Block storage lives inside `pyred` per ARCHITECTURE.md crate map.
      Do NOT create `pyre-store` or `pyre-blocks` crates.
    - Tantivy lands in S3. S2 search is linear scan over decompressed blobs.
    - Linux-first. Windows still cfg-gated and untested.
    - clippy -D warnings + fmt --check are gates.

nodes:
  - id: deps-s2
    name: Wire S2 dependencies
    is_start: true
    prompt_injection: |
      Phase 1 — deps-s2. DELEGATE to @backend-rust.

      Edit workspace + crate Cargo.tomls (no source).

      Root /home/rixmerz/Projects/pyre/Cargo.toml [workspace.dependencies]: add
        sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "uuid"] }
        zstd = "0.13"
        alacritty_terminal = "0.24"
        dirs = "5"
        regex = "1"
        async-trait = "0.1"

      pyre-proto deps: add `chrono.workspace = true` (already), nothing new.
      pyred deps add: sqlx, zstd, alacritty_terminal, dirs, regex, async-trait.
      pyrec deps add: nothing new (uses tarpc client only).

      MILESTONE: `cargo check --workspace` exits 0. `cargo fmt --check` 0. Do NOT commit.
      Post: livespec index_project + DCC cube_reindex on touched Cargo.tomls.
      Then graph_traverse to block-proto.

  - id: block-proto
    name: Block types + RPC additions in pyre-proto
    prompt_injection: |
      Phase 2 — block-proto. DELEGATE to @backend-rust.

      In crates/pyre-proto/src/service.rs (or new `blocks.rs` re-exported from lib.rs):

      Types (Serialize + Deserialize + Clone + Debug):
        BlockId(pub uuid::Uuid)
        Block {
          id: BlockId, pane: PaneId, session: SessionId,
          command: String, cwd: Option<PathBuf>,
          started_at: chrono::DateTime<Utc>,
          ended_at: Option<DateTime<Utc>>,
          exit_code: Option<i32>,
          stdout_len: u64,
        }
        BlockEvent enum:
          PromptStart { session: SessionId },
          CommandStart { session: SessionId, block: BlockId, command: String, cwd: Option<PathBuf> },
          OutputChunk { block: BlockId, data: Bytes },
          BlockEnd { block: BlockId, exit_code: Option<i32> },

        ListBlocksReq { session: Option<SessionId>, limit: u32 }
        SearchBlocksReq { query: String, limit: u32 }
        BlockHit { block: Block, snippet: String }  // snippet = first matching line

      Extend the #[tarpc::service] PyreDaemon trait with:
        async fn list_blocks(req: ListBlocksReq) -> Result<Vec<Block>, PyreError>;
        async fn search_blocks(req: SearchBlocksReq) -> Result<Vec<BlockHit>, PyreError>;

      Re-export new types from lib.rs.

      Acceptance: cargo check -p pyre-proto = 0; clippy -p pyre-proto -- -D warnings = 0; fmt clean; workspace check 0.
      Post: livespec index + cube_reindex on the touched files.
      Then graph_traverse to parser.

  - id: parser
    name: alacritty parser + OSC 133 detection in pyred
    prompt_injection: |
      Phase 3 — parser. DELEGATE to @backend-rust.

      New module crates/pyred/src/parser.rs.

      Design: a per-session `BlockParser` that consumes PTY output bytes and
      emits BlockEvent. Use `alacritty_terminal::vte::Parser` (re-exported as
      `alacritty_terminal::ansi::Processor` in some versions — check what
      0.24 exposes; pick the lowest-level VTE parser if both are present).

      Implement `vte::Perform` (or alacritty's equivalent trait) on a
      `BlockMachine` struct that:
        - tracks `current_block: Option<BlockId>`
        - on `osc_dispatch(params)` where params[0] == b"133":
            sub-token == b"A"            -> emit PromptStart
            sub-token == b"B"            -> ignore for now (some shells emit B differently)
            sub-token starts with b"C"   -> create new BlockId, emit CommandStart
                                            (command text accumulated from the bytes between A and C —
                                            track in a buffer fed by `print()` between markers)
            sub-token starts with b"D"   -> parse optional exit code after ';',
                                            emit BlockEnd, clear current_block
        - on every `print(c)` or `execute(b)` while current_block.is_some():
            push byte to an OutputChunk buffer; flush in chunks of 4 KB or
            on each newline (whichever first).

      Public API:
        pub struct BlockParser { ... }
        impl BlockParser {
            pub fn new(session: SessionId) -> Self;
            /// Feed raw PTY bytes; collect emitted BlockEvent in `out`.
            pub fn feed(&mut self, bytes: &[u8], out: &mut Vec<BlockEvent>);
        }

      Wire it: in pty.rs reader thread, after broadcasting raw bytes,
      ALSO send the bytes to an `mpsc::UnboundedSender<Bytes>` owned by the
      session. Spawn a tokio task that owns the BlockParser, drains the
      receiver, calls feed(), and forwards events on a session-level
      `broadcast::Sender<BlockEvent>` stored on PtySession.

      Acceptance: cargo check/clippy/fmt all 0 workspace-wide. Unit tests in
      parser.rs: feed `b"\x1b]133;A\x07pwd\x1b]133;C\x07/tmp\n\x1b]133;D;0\x07"`
      asserts PromptStart, CommandStart{command:"pwd"}, OutputChunk("/tmp\n"),
      BlockEnd{exit_code:Some(0)} (order matters).

      Post: livespec + DCC reindex on parser.rs + pty.rs.
      Then graph_traverse to store.

  - id: store
    name: SQLite + zstd blob store in pyred
    prompt_injection: |
      Phase 4 — store. DELEGATE to @backend-rust.

      New module crates/pyred/src/store.rs.

      Resolve data dir: `dirs::data_dir().unwrap_or(/tmp).join("pyre")`.
      Override via env `PYRE_DATA_DIR` (test hook). mkdir -p; mkdir -p `blocks/` subdir for blobs.

      Sqlite: connect via sqlx::SqlitePool to `<data>/state.db?mode=rwc`.
      Enable WAL via `PRAGMA journal_mode=WAL` after connect.

      Embed migrations (use sqlx::migrate! with crates/pyred/migrations/0001_init.sql):
        sessions(id TEXT PK, name TEXT, created_at INTEGER, last_active_at INTEGER)
        panes(id TEXT PK, session_id TEXT, argv TEXT, cwd TEXT, cols INTEGER, rows INTEGER, created_at INTEGER, closed_at INTEGER)
        blocks(id TEXT PK, pane_id TEXT, session_id TEXT, command TEXT,
               started_at INTEGER, ended_at INTEGER, exit_code INTEGER,
               cwd TEXT, stdout_blob_path TEXT, stdout_len INTEGER NOT NULL DEFAULT 0)
        CREATE INDEX blocks_session_started ON blocks(session_id, started_at DESC);

      API on `Store`:
        async fn open() -> Result<Self>
        async fn upsert_session(&self, id: SessionId, name: &str) -> Result<()>
        async fn upsert_pane(&self, ...) -> Result<()>  // takes minimal fields
        async fn create_block(&self, block: &Block) -> Result<()>
        async fn finalize_block(&self, id: BlockId, ended_at: DateTime<Utc>, exit: Option<i32>, stdout_len: u64) -> Result<()>
        async fn list_blocks(&self, session: Option<SessionId>, limit: u32) -> Result<Vec<Block>>
        async fn linear_search(&self, query: &str, limit: u32) -> Result<Vec<BlockHit>>
          // decompress each blob, scan lines, return BlockHit with first matching line as snippet.
        fn blob_path_for(&self, id: BlockId) -> PathBuf  // <data>/blocks/<id>.zst

      Blob writer:
        pub struct BlobWriter { file: std::fs::File, enc: zstd::Encoder<'static, BufWriter<File>>, len: u64 }
        impl BlobWriter { pub fn open(path:&Path); pub fn write(&mut self, bytes:&[u8]); pub fn close(self) -> u64 { len } }
      Run writer ops on a `tokio::task::spawn_blocking` boundary OR own them in a per-block dedicated thread fed via mpsc — pick the simpler one (spawn_blocking).

      Acceptance: cargo check -p pyred = 0, clippy clean, fmt clean. Unit test: open Store at TempDir-overridden data dir, create_block + finalize_block, list_blocks returns it.

      Post: livespec + DCC reindex on store.rs + migrations/0001_init.sql + pyred/Cargo.toml.
      Then graph_traverse to wire-blocks.

  - id: wire-blocks
    name: Connect parser events to store
    prompt_injection: |
      Phase 5 — wire-blocks. DELEGATE to @backend-rust.

      Edit crates/pyred/src/pty.rs (or a new `session.rs`):

      - PtySession now carries `Arc<Store>`.
      - When spawning a PTY: call `store.upsert_session` + `upsert_pane`.
      - Per-session BlockEvent task (from phase 3) now writes to store:
          PromptStart                            -> no-op (just emit on broadcast)
          CommandStart { block, command, cwd }   -> store.create_block(...).await + open BlobWriter at blob_path_for(block); stash in a HashMap<BlockId, BlobWriter>.
          OutputChunk { block, data }            -> blob_writer.write(data) via spawn_blocking; track running stdout_len.
          BlockEnd { block, exit_code }          -> close blob, store.finalize_block(...).await
      - Also broadcast BlockEvent on PtySession for stream-mode consumers (future use; safe to add now).

      Pass an `Arc<Store>` into the SessionRegistry at daemon startup (open Store in main.rs before binding UDS; abort on store error).

      Acceptance: cargo check/clippy/fmt all 0. Existing smoke test (`cargo test -p pyred --test smoke`) STILL passes — the additional store path must not regress raw byte delivery.

      Post: livespec + DCC reindex on the changed files.
      Then graph_traverse to rpc-list.

  - id: rpc-list
    name: list_blocks + search_blocks RPCs on pyred
    prompt_injection: |
      Phase 6 — rpc-list. DELEGATE to @backend-rust.

      Edit crates/pyred/src/server.rs:

      DaemonImpl gains `store: Arc<Store>`. Implement:
        async fn list_blocks(self, _ctx, req: ListBlocksReq) -> Result<Vec<Block>, PyreError> {
            self.store.list_blocks(req.session, req.limit).await
                .map_err(|e| PyreError::Io(e.to_string()))
        }
        async fn search_blocks(self, _ctx, req: SearchBlocksReq) -> Result<Vec<BlockHit>, PyreError> {
            self.store.linear_search(&req.query, req.limit).await
                .map_err(|e| PyreError::Io(e.to_string()))
        }

      Update main.rs to construct `DaemonImpl { registry, store }`.

      Acceptance: cargo build -p pyred = 0; clippy/fmt clean; existing smoke still passes.
      Post: reindex server.rs + main.rs.
      Then graph_traverse to pyrec-cli.

  - id: pyrec-cli
    name: pyrec list + pyrec search subcommands
    prompt_injection: |
      Phase 7 — pyrec-cli. DELEGATE to @backend-rust.

      Refactor crates/pyrec/src/main.rs to use clap subcommands while keeping
      the default (no subcommand) behavior as the current interactive attach.

        pyrec                       -> interactive (current behavior)
        pyrec list [--limit N]      -> control conn, call list_blocks, print
                                       `<short-id>  <time>  <exit>  <cmd>`
                                       one per line
        pyrec search <query> [--limit N]
                                    -> control conn, call search_blocks, print
                                       `<short-id>  <cmd>\n    <snippet>`

      Time format: `chrono::DateTime::format("%Y-%m-%d %H:%M:%S")`.
      Short id: first 8 chars of UUID hex.

      Acceptance: cargo build -p pyrec = 0; clippy/fmt clean.
      Post: reindex pyrec/src/main.rs.
      Then graph_traverse to smoke-blocks.

  - id: smoke-blocks
    name: Integration smoke for blocks
    prompt_injection: |
      Phase 8 — smoke-blocks. DELEGATE to @tester-rust.

      New crates/pyred/tests/blocks.rs (separate from existing smoke.rs).

      Setup mirrors smoke.rs: TempDir for XDG_RUNTIME_DIR AND PYRE_DATA_DIR
      (set both env vars on the pyred Command), spawn pyred binary, wait for
      socket.

      Test flow:
        1. Control conn -> Spawn(SpawnReq{ shell: "/bin/sh", cols:80, rows:24, env: vec![] }).
        2. Stream conn -> session UUID.
        3. Send InputFrame containing literally:
             b"printf '\\x1b]133;A\\x07pwd\\x1b]133;C\\x07'; pwd; printf '\\x1b]133;D;0\\x07'\nexit\n"
           (This makes the shell itself emit the OSC 133 markers around `pwd`.)
        4. Read OutputFrame stream until EOF or 5s timeout.
        5. Close stream + control.
        6. Reopen a control conn (or reuse), call list_blocks(None, 10).
           Assert at least one Block returned whose `command` contains "pwd"
           and `exit_code == Some(0)`.
        7. Call search_blocks("pwd", 10) -> at least one BlockHit.
        8. SIGTERM pyred, wait for exit, assert socket file gone.
        9. Assert <PYRE_DATA_DIR>/pyre/blocks/<block_id>.zst exists and is non-empty.

      Acceptance: cargo test -p pyred --test blocks -- --nocapture passes.
      `cargo test -p pyred --test smoke -- --nocapture` STILL passes.
      cargo clippy --workspace --all-targets -- -D warnings clean.
      cargo fmt --all -- --check clean.

      If a real bug surfaces in pyred or pyrec, STOP and report; do not patch
      the test to mask it.

      Post: reindex tests/blocks.rs.
      Then graph_traverse to commit-s2.

  - id: commit-s2
    name: Conventional commit S2
    is_end: true
    prompt_injection: |
      Phase 9 — commit. DELEGATE to @backend-rust (or do it directly).

      git status / git diff --stat first to verify the change set is clean
      (no stray files, no .jig/.claude state). Then `git add -A` and:

        feat: s2 blocks + sqlite + zstd + linear search

        Why: S2 lands persistence. alacritty_terminal parses PTY output for
        OSC 133 markers (A/C/D) and materialises Block records. Each block's
        stdout streams to a zstd-compressed blob under
        $XDG_DATA_HOME/pyre/blocks/<id>.zst; metadata lives in a WAL-mode
        SQLite at $XDG_DATA_HOME/pyre/state.db. PyreDaemon gains list_blocks
        and search_blocks (linear scan over decompressed blobs); pyrec gets
        `list` and `search` subcommands. Tantivy + structured search land
        in S3.

        Co-Authored-By: Claude <noreply@anthropic.com>

      Do NOT push. MILESTONE: git log -1 --pretty=%s == subject above.

      Workflow complete. Next: ROADMAP S3 (Tantivy + indexer + ranked search).

edges:
  - id: e_deps_proto
    from: deps-s2
    to: block-proto
  - id: e_proto_parser
    from: block-proto
    to: parser
  - id: e_parser_store
    from: parser
    to: store
  - id: e_store_wire
    from: store
    to: wire-blocks
  - id: e_wire_rpc
    from: wire-blocks
    to: rpc-list
  - id: e_rpc_cli
    from: rpc-list
    to: pyrec-cli
  - id: e_cli_smoke
    from: pyrec-cli
    to: smoke-blocks
  - id: e_smoke_commit
    from: smoke-blocks
    to: commit-s2
