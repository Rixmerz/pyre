metadata:
  name: "Pyre S3 Multi-Pane + Reattach"
  description: "Sprint 3: multiple panes per session, multiple sessions, full reattach with grid snapshot + last N blocks replay, multi-client mirror mode with serialized input."
  version: "1.0.0"
  type: "graph"

nodes:
  - id: "session-model"
    name: "Session/Pane model + RPCs in pyre-proto"
    is_start: true
    mcps_enabled:
      - "*"
    max_visits: 10
    prompt_injection: |
      Phase 1 — session-model. DELEGATE to @backend-rust.
      
      Extend pyre-proto for multi-session/multi-pane. Read crates/pyre-proto/src/lib.rs + service.rs first.
      
      ## Types (add or adjust)
      
      - SessionInfo { id: SessionId, name: String, pane_count: u32, created_at: DateTime<Utc>, last_active_at: DateTime<Utc> }
      - PaneInfo { id: PaneId, session: SessionId, cols: u16, rows: u16, shell: String, created_at: DateTime<Utc>, closed_at: Option<DateTime<Utc>> }
      - OpenPaneReq { session: SessionId, shell: Option<String>, cwd: Option<PathBuf>, cols: u16, rows: u16, env: Vec<(String,String)> }
      - ReplayBlocks { recent: Vec<Block>, snapshot: Bytes }  — `snapshot` = last-N-bytes ring buffer prefix.
      
      ## Extend PyreDaemon service
      
      Add:
        async fn list_sessions() -> Result<Vec<SessionInfo>, PyreError>;
        async fn list_panes(session: SessionId) -> Result<Vec<PaneInfo>, PyreError>;
        async fn open_pane(req: OpenPaneReq) -> Result<PaneId, PyreError>;
        async fn close_pane(pane: PaneId) -> Result<(), PyreError>;
        async fn replay(pane: PaneId, recent_blocks: u32) -> Result<ReplayBlocks, PyreError>;
      
      Keep existing spawn — now documented as `spawn = open new session + first pane`. Return both SessionId AND first PaneId. Change SpawnResp to:
        struct SpawnResp { session: SessionId, pane: PaneId }
        async fn spawn(req: SpawnReq) -> Result<SpawnResp, PyreError>;
      
      ## Stream protocol bump (document in service.rs //!)
      
      After MODE_STREAM tag the client now writes:
        16 bytes SessionId   (Uuid as_bytes)
        16 bytes PaneId      (Uuid as_bytes)
      Then length-delimited bincode bidirectional.
      
      Server behavior on stream connect: first send ReplayBlocks-snapshot-bytes as one synthetic OutputFrame (seq=0), then live broadcast.
      
      ## pyred stub adjustments
      
      In crates/pyred/src/server.rs add empty stubs for the 5 new methods returning Ok(empty/default) — phases 2–6 wire them. Update spawn impl to return SpawnResp { session, pane }.
      
      ## Acceptance
      - cargo check --workspace 0
      - cargo clippy --workspace --all-targets -- -D warnings 0
      - cargo fmt --check 0
      - S1 smoke + S2 blocks tests STILL pass (clients need updating only if SpawnResp shape changed their wire — yes it did; update pyrec accordingly, and update both smoke tests to consume `.session` from the response).
      
      ## Post
      - livespec index_project + DCC cube_reindex touched files.
      Then graph_traverse to registry.

  - id: "registry"
    name: "Multi-pane SessionRegistry in pyred"
    mcps_enabled:
      - "*"
    max_visits: 10
    prompt_injection: |
      Phase 2 — registry. DELEGATE to @backend-rust.
      
      Goal: SessionRegistry holds many Sessions; each Session holds many Panes.
      
      New shape (crates/pyred/src/pty.rs or split into session.rs):
      
        pub struct PaneState {  // renamed from PtySession
            pub id: PaneId,
            pub session: SessionId,
            pub cols: u16, pub rows: u16, pub shell: String,
            pub created_at: DateTime<Utc>,
            pub closed_at: Mutex<Option<DateTime<Utc>>>,
            // existing fields: master, child, output_tx (broadcast<Bytes>), input_tx (mpsc<Bytes>), events_tx (broadcast<BlockEvent>)
        }
      
        pub struct SessionState {
            pub id: SessionId,
            pub name: RwLock<String>,
            pub created_at: DateTime<Utc>,
            pub last_active_at: Mutex<DateTime<Utc>>,
            pub panes: Mutex<HashMap<PaneId, Arc<PaneState>>>,
        }
      
        pub struct SessionRegistry {
            sessions: Mutex<HashMap<SessionId, Arc<SessionState>>>,
        }
      
        impl SessionRegistry:
          pub async fn new_session(&self, store: Arc<Store>) -> Arc<SessionState>  // upsert_session in store
          pub async fn open_pane(&self, session: SessionId, req: OpenPaneReq, store: Arc<Store>) -> Result<Arc<PaneState>>  // upsert_pane + spawn_pty inside
          pub async fn get_session(&self, id: SessionId) -> Option<Arc<SessionState>>
          pub async fn get_pane(&self, pane: PaneId) -> Option<(Arc<SessionState>, Arc<PaneState>)>  // scan; OK for S3
          pub async fn close_pane(&self, pane: PaneId) -> Result<()>  // kill + mark closed_at + emit?
          pub async fn list_sessions(&self) -> Vec<SessionInfo>
          pub async fn list_panes(&self, session: SessionId) -> Vec<PaneInfo>
      
      spawn_pty signature: drop SessionId generation; caller passes session_id. Returns PaneState (not Arc — caller wraps).
      
      Server impl in server.rs:
        spawn(req)        -> registry.new_session + registry.open_pane(session, req) -> SpawnResp { session, pane }
        attach(session)   -> registry.get_session; AttachAck (existing); cols/rows = first pane's, or 0/0 if no panes
        open_pane(req)    -> registry.open_pane
        close_pane(pane)  -> registry.close_pane
        list_sessions()   -> registry.list_sessions
        list_panes(s)     -> registry.list_panes
        kill(session)     -> registry.close all panes in session
      
      ## Acceptance
      - cargo check/clippy/fmt workspace clean
      - S1 smoke + S2 blocks tests STILL pass (update their stream-conn writes to send Session+Pane UUIDs — see stream-target phase; that phase covers it). For now if those tests break compile, fix the call sites only; functional pass comes after phase 4.
      
      If reasonably scoped to keep tests passing now, fine. Otherwise mark them `#[ignore]` with a TODO referencing phase 4 and report — they'll re-enable in stream-target.
      
      ## Post
      - livespec + DCC reindex touched files.
      Then graph_traverse to ringbuf.

  - id: "ringbuf"
    name: "Per-pane ring buffer for grid snapshot"
    mcps_enabled:
      - "*"
    max_visits: 10
    prompt_injection: |
      Phase 3 — ringbuf. DELEGATE to @backend-rust.
      
      Goal: each PaneState has a 64 KB ring buffer of last raw PTY output bytes, ready to replay on reattach.
      
      ## New module: crates/pyred/src/ringbuf.rs
      
        pub struct RingBuf { buf: Vec<u8>, head: usize, len: usize, cap: usize }
        impl RingBuf {
            pub fn new(cap: usize) -> Self;
            pub fn push(&mut self, bytes: &[u8]);
            pub fn snapshot(&self) -> Bytes;   // returns linearized copy oldest..newest
            pub fn len(&self) -> usize;
            pub fn cap(&self) -> usize;
        }
      
      Unit tests: push 0 bytes, push < cap, push > cap (wrap), boundary at exactly cap.
      
      ## Wire into PaneState
      
      - pty.rs PaneState: add `pub ringbuf: Arc<Mutex<RingBuf>>` (capacity 64 * 1024).
      - In the reader thread (the std::thread::spawn that reads master): BEFORE broadcasting + parser fan-out, push to ringbuf:
          let mut rb = ringbuf.lock().expect("ring buf poisoned"); rb.push(&buf[..n]); drop(rb);
        Use std::sync::Mutex (NOT tokio) because we are in the blocking thread. Wrap in Arc.
      
      ## Acceptance
      - cargo check/clippy/fmt workspace clean (ringbuf unit tests pass).
      - Existing smoke tests still compile (may be #[ignore]d from phase 2 — leave that as-is).
      
      ## Post
      - livespec + DCC reindex on ringbuf.rs + pty.rs.
      Then graph_traverse to stream-target.

  - id: "stream-target"
    name: "Stream protocol bump: target Pane + replay snapshot"
    mcps_enabled:
      - "*"
    max_visits: 10
    prompt_injection: |
      Phase 4 — stream-target. DELEGATE to @backend-rust.
      
      Goal: stream connection now targets a specific (Session, Pane). Daemon replays the ring buffer before live broadcast. Multiple stream conns on same pane all see same output (broadcast). Input from any conn feeds the pane.
      
      ## Edit crates/pyred/src/stream.rs
      
      handle_stream signature stays (takes UnixStream + Arc<SessionRegistry>). Logic:
      
      1. Read 16 bytes -> SessionId.
      2. Read 16 bytes -> PaneId.
      3. registry.get_pane(pane). If None or pane.session != session -> close conn with one final OutputFrame { seq: 0, data: b"<pyre: unknown pane>" }? Actually just shutdown.
      4. Acquire ringbuf snapshot (lock, snapshot(), drop) -> first OutputFrame { session, seq: 0, data: snapshot }. Write it BEFORE the live subscribe.
      5. subscribe to pane.output_tx (broadcast). seq starts at 1.
      6. Recv loop and send loop as before. Input drains into pane.input_tx — mpsc already serializes writers.
      
      ## Edit pyrec stream handshake (main.rs run_attach + smoke tests)
      
      Client now writes [MODE_STREAM] + session_uuid + pane_uuid (32 bytes total after tag). Receives the first OutputFrame as the snapshot prefix — write it to stdout same as live frames (the bytes are raw VT100, just play them).
      
      ## Update existing tests
      
      Un-ignore the S1 smoke + S2 blocks if phase 2 ignored them. Update their stream conn to write 16-byte session + 16-byte pane uuids. Need to call `spawn` -> get SpawnResp { session, pane }, then stream-target with both.
      
      ## Acceptance
      - cargo build workspace 0
      - cargo clippy --workspace --all-targets -- -D warnings 0
      - cargo fmt --check 0
      - cargo test -p pyred --test smoke green
      - cargo test -p pyred --test blocks green
      
      ## Post
      - reindex stream.rs, pty.rs, main.rs (pyred + pyrec), tests/smoke.rs, tests/blocks.rs.
      Then graph_traverse to replay-blocks.

  - id: "replay-blocks"
    name: "replay RPC: recent blocks + snapshot"
    mcps_enabled:
      - "*"
    max_visits: 10
    prompt_injection: |
      Phase 5 — replay-blocks. DELEGATE to @backend-rust.
      
      Goal: implement the `replay` control RPC. Client calls before opening stream to fetch context (recent block metadata + current snapshot bytes — same snapshot the stream will replay; one of the two is informational, but both are useful for richer UIs in S4).
      
      ## Edit pyred server.rs
      
      async fn replay(self, _ctx, pane: PaneId, recent_blocks: u32) -> Result<ReplayBlocks, PyreError> {
          let (_session_state, pane_state) = registry.get_pane(pane).await
              .ok_or(PyreError::NoSuchSession(pane.session_id_or_dummy_via_lookup))?;
          // Actually PyreError::NoSuchSession takes SessionId — add a NoSuchPane(PaneId) variant OR just reuse Io(format!("no pane {pane}")).
          let snapshot = {
              let rb = pane_state.ringbuf.lock().unwrap();
              rb.snapshot()
          };
          // Add Store::list_blocks_for_pane(pane: PaneId, limit: u32) -> Vec<Block>. Mirror existing list_blocks; WHERE pane_id = ?1.
          let recent = self.store
              .list_blocks_for_pane(pane, recent_blocks)
              .await
              .map_err(|e| PyreError::Io(e.to_string()))?;
          Ok(ReplayBlocks { recent, snapshot })
      }
      
      Also add the NoSuchPane variant to PyreError in pyre-proto for cleaner errors — bump matched in all error-mapping call sites.
      
      ## Edit store.rs
      
      pub async fn list_blocks_for_pane(&self, pane: PaneId, limit: u32) -> Result<Vec<Block>> — same body as list_blocks but filtered by pane_id column.
      
      ## Acceptance
      - cargo check/clippy/fmt clean
      - Existing tests still green
      - Add a small unit test in store.rs: create two panes, insert blocks for each, assert list_blocks_for_pane returns only the matching one.
      
      ## Post
      - livespec + DCC reindex server.rs, store.rs, pyre-proto/src/blocks.rs (if PyreError changed there).
      Then graph_traverse to pyrec-multi.

  - id: "pyrec-multi"
    name: "pyrec multi-session/pane subcommands"
    mcps_enabled:
      - "*"
    max_visits: 10
    prompt_injection: |
      Phase 6 — pyrec-multi. DELEGATE to @backend-rust.
      
      Extend pyrec CLI to drive multiple sessions and panes. Read existing crates/pyrec/src/main.rs (post-S2; has list/search subcommands + default-attach).
      
      ## Subcommands (clap)
      
        pyrec                                          -> NEW session + first pane, attach (current spawn behavior)
        pyrec sessions                                 -> control conn: list_sessions, print one per line
        pyrec panes <session>                          -> control conn: list_panes(session), print one per line
        pyrec attach <session> [--pane <pane-id>]      -> attach to existing pane (no spawn); if --pane omitted, pick first open
        pyrec new-pane <session> [--shell SHELL] [--cols N --rows M]  -> open_pane, then print pane id (no attach)
        pyrec list / pyrec search ...                  -> unchanged (S2)
      
      Short IDs accepted as prefixes (first 8 chars) for `session` and `--pane` args — match against list_sessions / list_panes by prefix.
      
      ## Attach flow refactor
      
      run_attach now takes (session: SessionId, pane: PaneId). For the default `pyrec` (no subcommand): control.spawn(req) returns SpawnResp { session, pane }; then run_attach(session, pane).
      
      run_attach: open stream conn, write [MODE_STREAM] + session.bytes() + pane.bytes(). The first OutputFrame is the snapshot prefix — handle it like any other frame.
      
      ## Acceptance
      - cargo build -p pyrec 0; clippy/fmt clean
      - Workspace tests still green
      - Help works for each subcommand (no functional test required, but verify via reading the derive macro carefully).
      
      ## Post
      - livespec + DCC reindex pyrec/src/main.rs.
      Then graph_traverse to smoke-multi.

  - id: "smoke-multi"
    name: "Integration smoke: multi-pane + mirror + reattach"
    mcps_enabled:
      - "*"
    max_visits: 10
    prompt_injection: |
      Phase 7 — smoke-multi. DELEGATE to @tester-rust.
      
      New crates/pyred/tests/multi.rs. Mirror smoke.rs setup (TempDirs for XDG_RUNTIME_DIR + PYRE_DATA_DIR, spawn pyred binary, kill on drop, 30 s outer timeout).
      
      ## Test 1: multi-pane in one session
      
      1. control.spawn(req) -> SpawnResp { session, pane: p1 }.
      2. control.open_pane(OpenPaneReq { session, shell: Some("/bin/sh".into()), cols:80, rows:24, env: vec![], cwd: None }) -> p2.
      3. control.list_panes(session) -> assert 2 entries containing p1 and p2.
      4. Open stream conn for p1, send `echo p1_marker\nexit\n`, accumulate output, assert b"p1_marker" present.
      5. Open stream conn for p2, send `echo p2_marker\nexit\n`, accumulate, assert b"p2_marker" present.
      6. control.list_sessions() -> assert exactly 1 session.
      
      ## Test 2: mirror (two clients, same pane)
      
      1. control.spawn -> SpawnResp { session, pane }.
      2. Open stream conn A for pane.
      3. Open stream conn B for pane.
      4. From A send `echo mirror_test\n`.
      5. Read from BOTH A and B with 3 s timeout; assert each accumulated buffer contains b"mirror_test".
      6. Send `exit\n` from A; both connections receive EOF eventually.
      
      ## Test 3: reattach replay
      
      1. control.spawn -> SpawnResp { session, pane }.
      2. Stream conn 1: send `echo first_run\n`. Read; confirm b"first_run" in output. Drop the stream connection (close socket).
      3. Sleep 200 ms for daemon to register disconnect.
      4. Stream conn 2 (REattach): connect, [MODE_STREAM] + session + pane. The FIRST OutputFrame should be the ring-buffer snapshot — assert it contains b"first_run" (since the pane's reader pushed it into ringbuf).
      5. Send `exit\n`, drain, done.
      
      ## Acceptance
      - cargo test -p pyred --test multi -- --nocapture passes
      - S1 smoke + S2 blocks tests STILL pass
      - cargo clippy --workspace --all-targets -- -D warnings clean
      - cargo fmt --check clean
      
      If a real pyred/pyrec bug surfaces (mirror doesn't fan out, replay loses bytes, list_panes returns wrong session), STOP and report — do NOT patch pyred to mask.
      
      ## Post
      - DCC cube_reindex tests/multi.rs.
      Then graph_traverse to commit-s3.

  - id: "commit-s3"
    name: "Conventional commit S3"
    is_end: true
    mcps_enabled:
      - "*"
    max_visits: 10
    prompt_injection: |
      Phase 8 — commit. DELEGATE to @backend-rust (small task) or do directly.
      
      git status / diff --stat first to verify clean change set. Then `git add -A` and:
      
        feat: s3 multi-pane + reattach + mirror
      
        Why: S3 lifts pyred from one-pane-per-daemon to N sessions x N panes,
        with full reattach via a per-pane 64 KB ring buffer replayed on stream
        connect and a new replay RPC returning recent blocks + snapshot bytes
        for richer UIs. Multiple stream connections on the same pane mirror
        output and serialize input through the existing mpsc writer. pyrec
        grows `sessions`, `panes`, `attach`, and `new-pane` subcommands;
        default `pyrec` still spawns a new session + first pane. Tantivy and
        the TUI dogfood arrive in S4.
      
        Co-Authored-By: Claude <noreply@anthropic.com>
      
      Do NOT push. Verify git log -1 --pretty=%s matches subject. Final git status reported.
      
      Workflow complete. Next: ROADMAP S4 (TUI MVP with Tantivy-backed search).

edges:
  - id: "e1"
    from: "session-model"
    to: "registry"
    condition:
      type: "always"

  - id: "e2"
    from: "registry"
    to: "ringbuf"
    condition:
      type: "always"

  - id: "e3"
    from: "ringbuf"
    to: "stream-target"
    condition:
      type: "always"

  - id: "e4"
    from: "stream-target"
    to: "replay-blocks"
    condition:
      type: "always"

  - id: "e5"
    from: "replay-blocks"
    to: "pyrec-multi"
    condition:
      type: "always"

  - id: "e6"
    from: "pyrec-multi"
    to: "smoke-multi"
    condition:
      type: "always"

  - id: "e7"
    from: "smoke-multi"
    to: "commit-s3"
    condition:
      type: "always"
